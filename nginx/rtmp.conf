rtmp {
    server {
        listen 1935;        # RTMP port — industry standard
        chunk_size 4096;    # size of each RTMP chunk in bytes

        application live {
            live on;
            record off;     # don't record streams to disk for now

            # Deny direct playback via RTMP — viewers must use HLS
            deny play all;

            # When a stream starts, call our backend to verify the stream key
            # This prevents unauthorized streaming
            on_publish http://backend:5000/api/streams/authenticate;

            # When stream ends, notify backend
            on_publish_done http://backend:5000/api/streams/done;

            # Execute FFmpeg when a stream starts
            # This transcodes RTMP → HLS segments
            exec ffmpeg -i rtmp://localhost:1935/live/$name
                -c:v libx264          
                -c:a aac              
                -f hls                
                -hls_time 2           
                -hls_list_size 6      
                -hls_flags delete_segments
                /tmp/hls/$name/index.m3u8;
        }
    }
}

/*
listen 1935 — RTMP standard port, same as HTTP uses 80
live on — enables live streaming mode
deny play all — viewers cannot watch via RTMP, only HLS. Keeps delivery scalable.
on_publish — before accepting a stream, calls our backend API to verify the stream key. If backend returns non-200, stream is rejected.

FFmpeg flags:
-i rtmp://localhost:1935/live/$name   → input: incoming RTMP stream
-c:v libx264                          → encode video as H.264
-c:a aac                              → encode audio as AAC  
-f hls                                → output format: HLS
-hls_time 2                           → each segment = 2 seconds
-hls_list_size 6                      → keep last 6 segments in playlist
-hls_flags delete_segments            → auto-delete old segments (saves disk)
/tmp/hls/$name/index.m3u8            → output path ($name = stream key)
$name is the stream key — so rtmp://server/live/abc123 creates /tmp/hls/abc123/index.m3u8
*/