version: '3.8'

services:
  # MongoDB service
  mongodb:
    image: mongo:7
    container_name: streamflow_mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db  # persist data outside container
    networks:
      - streamflow_network

  # Redis service
  redis:
    image: redis:7-alpine
    container_name: streamflow_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - streamflow_network

  # Backend service
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: streamflow_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/streamflow
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRES=15m
      - JWT_REFRESH_EXPIRES=7d
      - CLIENT_URL=http://localhost
    depends_on:
      - mongodb
      - redis
    networks:
      - streamflow_network

  # Frontend service
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: streamflow_frontend
    restart: unless-stopped
    ports:
      - "80:80"  # expose port 80 to host
    depends_on:
      - backend
    networks:
      - streamflow_network

# Named volumes — data persists even when containers stop
volumes:
  mongodb_data:
  redis_data:

# Internal network — containers talk to each other by service name
networks:
  streamflow_network:
    driver: bridge