services:
  mongodb:
    image: mongo:7
    container_name: streamflow_mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - streamflow_network

  redis:
    image: redis:7-alpine
    container_name: streamflow_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - streamflow_network

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: streamflow_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/streamflow
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRES=15m
      - JWT_REFRESH_EXPIRES=7d
      - CLIENT_URL=http://localhost
    depends_on:
      - mongodb
      - redis
    networks:
      - streamflow_network

  nginx-rtmp:
    build:
      context: .
      dockerfile: nginx.Dockerfile
    container_name: streamflow_rtmp
    restart: unless-stopped
    ports:
      - "1935:1935"   # RTMP ingest port
      - "8080:80"     # HLS delivery port
    depends_on:
      - backend
    networks:
      - streamflow_network
    volumes:
      - hls_data:/tmp/hls  # shared HLS segments

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: streamflow_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - streamflow_network

volumes:
  mongodb_data:
  redis_data:
  hls_data:

networks:
  streamflow_network:
    driver: bridge